    <!-- Apply last-known site colors before the app bundle loads (see SiteColorsContext.jsx) -->
    <script>
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('site_colors'));
          if (!c) return;
          var s = document.documentElement.style;
          var rgb = function (hex) {
            var h = hex.replace('#', '');
            if (h.length === 3) h = h.split('').map(function (x) { return x + x; }).join('');
            var n = parseInt(h.slice(0, 6), 16);
            return ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255);
          };
          ['primary', 'secondary', 'accent', 'background', 'text', 'text_light'].forEach(function (k) {
            if (c['site_' + k]) s.setProperty('--site-' + k.replace('_', '-'), c['site_' + k]);
          });
          if (c.site_primary) s.setProperty('--site-primary-rgb', rgb(c.site_primary));
          if (c.site_secondary) s.setProperty('--site-secondary-rgb', rgb(c.site_secondary));
        } catch (e) {}
      })();
    </script>
